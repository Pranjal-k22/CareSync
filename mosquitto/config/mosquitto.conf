# Mosquitto MQTT Broker Configuration for HealConnect

per_listener_settings true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Connection Limits
max_connections 1000
max_queued_messages 1000
message_size_limit 2097152

# Listener 1: Local Development Unencrypted TCP Port 1883
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/password_file
acl_file /mosquitto/config/acl
protocol mqtt

# Listener 2: WebSockets Listener Port 9001
listener 9001 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/password_file
acl_file /mosquitto/config/acl
protocol websockets

# Listener 3: Production TLS Listener Blueprint (Port 8883 - Enable with X.509 certs in production)
# listener 8883 0.0.0.0
# allow_anonymous false
# password_file /mosquitto/config/password_file
# acl_file /mosquitto/config/acl
# cafile /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile /mosquitto/config/certs/server.key
# tls_version tlsv1.2
